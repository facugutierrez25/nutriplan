# Entorno local completo.
#   Solo la base:          docker compose up -d db
#   Base + backend:        docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-nutriplan}
      POSTGRES_USER: ${DB_USER:-nutriplan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nutriplan}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nutriplan} -d ${DB_NAME:-nutriplan}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-nutriplan}
      DB_USER: ${DB_USER:-nutriplan}
      DB_PASSWORD: ${DB_PASSWORD:-nutriplan}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
